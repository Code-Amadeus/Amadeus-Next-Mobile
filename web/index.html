<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'">
<title>Amadeus</title>
<link rel="stylesheet" href="style.css">
<script>
  // FreeMoteDriver 是 emscripten 产物，堆大小须在加载前给出；运行时只在第一次进入视频模式时加载
  var Module = { TOTAL_MEMORY: 512 * 1024 * 1024 };
  window.loadEmoteRuntime = function () {
    if (window.__emoteRuntime) return window.__emoteRuntime;
    window.__emoteRuntime = new Promise(function (resolve, reject) {
      var SCRIPTS = ["emote/pixi.min.js", "emote/FreeMoteDriver.js", "emote/emoteplayer.js"];
      function loadAt(i) {
        if (i >= SCRIPTS.length) { resolve(); return; }
        var s = document.createElement("script");
        s.src = SCRIPTS[i];
        s.onload = function () {
          // 顶层 class 声明不会成为 window 属性
          if (SCRIPTS[i] === "emote/emoteplayer.js") window.EmotePlayer = EmotePlayer;
          loadAt(i + 1);
        };
        s.onerror = function () { reject(new Error("立绘运行时加载失败")); };
        document.head.appendChild(s);
      }
      loadAt(0);
    });
    return window.__emoteRuntime;
  };
</script>
</head>
<body>

<!-- 对话模式：默认首页，只有聊天 -->
<div id="chat-view" class="view">
  <header class="chat-head">
    <img class="avatar" src="ui/logo.png" alt="">
    <div class="who">
      <div class="name">Amadeus</div>
      <div class="presence"><i></i><span id="presence">在线</span></div>
    </div>
    <button class="icon" id="start-call" aria-label="视频模式">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 10.5l5-3v9l-5-3z"/></svg>
    </button>
    <button class="icon" id="open-menu" aria-label="更多">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
    </button>
  </header>
  <div id="kernel" hidden></div>

  <main id="log">
    <div id="welcome">
      <img src="ui/logo.png" alt="">
      <h1>Amadeus</h1>
      <p>牧濑红莉栖的数字人格。可以聊天，也可以替你看屏幕、操作手机。</p>
      <div class="chips">
        <button data-say="今天天气怎么样？">今天天气怎么样？</button>
        <button data-say="帮我打开设置">帮我打开设置</button>
        <button data-say="半小时后提醒我喝水">半小时后提醒我喝水</button>
      </div>
    </div>
  </main>

  <footer class="composer">
    <div id="hearing" hidden></div>
    <div class="terminal">
      <span class="prompt">&gt;</span>
      <textarea id="input" rows="1" enterkeyhint="send" placeholder="对 Amadeus 说点什么…"></textarea>
      <button class="icon small" id="mic" aria-label="说话">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="icon small accent" id="send" aria-label="发送" hidden>
        <svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2-6z"/></svg>
      </button>
      <button class="icon small stop" id="stop" aria-label="停止" hidden>
        <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
      </button>
    </div>
  </footer>
</div>

<!-- 视频模式：立绘居中放大，连续语音对话 -->
<div id="call-view" class="view" hidden>
  <div class="crt"></div>
  <div id="stage"></div>
  <header class="call-head">
    <div class="who">
      <div class="name">Amadeus</div>
      <div class="timer" id="call-timer">正在接通…</div>
    </div>
    <div class="call-tools">
      <div id="call-state" class="chip" hidden></div>
      <button class="icon glass" id="call-look" aria-label="形象">
        <svg viewBox="0 0 24 24"><path d="M9 3l-5 3 2 4 2-1v12h8V9l2 1 2-4-5-3a3 3 0 0 1-6 0z"/></svg>
      </button>
    </div>
  </header>
  <div id="call-error"></div>
  <div class="caption">
    <div id="you-said" hidden></div>
    <div id="subtitle" hidden></div>
  </div>
  <footer class="call-controls">
    <button class="ctl" id="call-mute"><span class="disc">
      <svg class="on" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="M9 9v2a3 3 0 0 0 5.1 2.1M15 9.3V6a3 3 0 0 0-5.7-1.3M5 11a7 7 0 0 0 11.6 5.3M19 11a7 7 0 0 1-.6 2.8M12 18v3M3 3l18 18"/></svg>
    </span><span id="mute-label">静音</span></button>
    <button class="ctl end" id="end-call"><span class="disc">
      <svg viewBox="0 0 24 24"><path d="M3 14.5c5-5 13-5 18 0l-2.5 2.5-3-1.5v-2.5a9 9 0 0 0-7 0v2.5l-3 1.5z"/></svg>
    </span><span>挂断</span></button>
    <button class="ctl" id="call-to-chat"><span class="disc">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>
    </span><span>文字</span></button>
  </footer>
</div>

<!-- 更多菜单 -->
<div class="sheet" id="menu" hidden>
  <div class="scrim"></div>
  <div class="panel">
    <div class="grip"><span></span></div>
    <button class="menu-item" id="open-activity">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></svg><span>她做过的事</span>
    </button>
    <button class="menu-item" id="open-settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6A7 7 0 0 0 19 12z"/></svg><span>设置</span>
    </button>
  </div>
</div>

<!-- 形象 -->
<div class="sheet" id="looks" hidden>
  <div class="scrim"></div>
  <div class="panel">
    <div class="grip"><span></span></div>
    <h2>换个形象</h2>
    <p class="hint">换服装要重新加载一次；第一次用某套服装需要几秒准备。</p>
    <div id="look-list"></div>
  </div>
</div>

<!-- 动作记录 -->
<div class="sheet" id="activity" hidden>
  <div class="scrim"></div>
  <div class="panel tall">
    <div class="grip"><span></span></div>
    <h2>她做过的事</h2>
    <p class="hint">每个动作都经过 Guard 判决：<b class="ok">放行</b> · <b class="confirmed">你确认过</b> · <b class="denied">你拒绝了</b> · <b class="blocked">被拦下</b></p>
    <div id="verbs"></div>
  </div>
</div>

<!-- 设置 -->
<div class="page" id="settings" hidden>
  <header class="pagebar">
    <button class="icon" id="close-settings" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1>设置</h1>
    <button class="text" id="save">保存</button>
  </header>
  <form id="settings-form" autocomplete="off">
    <h3>权限</h3>
    <div class="group" id="permissions"></div>

    <h3>模型</h3>
    <div class="group">
      <label class="field"><span>协议</span>
        <select name="api">
          <option value="openai-responses">OpenAI Responses</option>
          <option value="anthropic-messages">Anthropic Messages</option>
          <option value="openai-completions">OpenAI Chat Completions</option>
        </select>
      </label>
      <label class="field"><span>Base URL</span><input name="baseUrl" type="url" inputmode="url" placeholder="https://api.example.com/v1"></label>
      <label class="field"><span>模型名</span><input name="modelId" placeholder="model id"></label>
      <label class="field"><span>API Key</span><input name="modelApiKey" type="password"></label>
      <label class="switch"><span>能看图</span><input name="vision" type="checkbox"><i></i></label>
      <label class="switch"><span>推理模型</span><input name="reasoning" type="checkbox"><i></i></label>
    </div>

    <h3>声音</h3>
    <div class="group">
      <label class="switch"><span>朗读回复</span><input name="speech" type="checkbox"><i></i></label>
      <label class="switch"><span>对话模式也常开监听<small>视频模式总是连续监听；这里控制对话模式</small></span><input name="continuous" type="checkbox"><i></i></label>
      <label class="field"><span>Fish Audio Key</span><input name="fishApiKey" type="password"></label>
      <label class="field"><span>Voice ID</span><input name="fishVoiceId" placeholder="留空用默认音色"></label>
    </div>

    <h3>通知</h3>
    <div class="group">
      <label class="field stacked"><span>这些应用来通知时告诉我<small>每行一个包名，如 com.tencent.mobileqq</small></span>
        <textarea name="notifyPackages" rows="3"></textarea>
      </label>
    </div>
  </form>
</div>

<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
